<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Tour Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>html, body, #map { height:100%; margin:0; }</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const A = {GEOJSON_1};           // Feature(Point)
    const B = {GEOJSON_2};           // Feature(Point)
    const ROUTE = {ROUTE_GEOJSON};   // Geometry(LineString) oder null

    const map = L.map('map').setView([48.2082, 16.3738], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom: 19}).addTo(map);

    const layers = [];
    if (ROUTE && (ROUTE.type === "LineString" || ROUTE.type === "MultiLineString")) {
        layers.push(L.geoJSON(ROUTE, {style:{weight:4}}).addTo(map));
    }
    layers.push(L.geoJSON([A,B]).addTo(map));

    const group = L.featureGroup(layers);
    map.fitBounds(group.getBounds(), {padding:[20,20]});
</script>
</body>
</html>
